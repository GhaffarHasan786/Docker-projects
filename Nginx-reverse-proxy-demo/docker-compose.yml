version: "3.8"

services:

  web-app:
    build: .
    container_name: devops-flask-app
    expose:
      - "5000"
    networks:
      - proxy-net

  reverse-proxy:
    image: nginx:alpine
    container_name: devops-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-app
    networks:
      - proxy-net


networks:
  proxy-net:
    driver: bridge
    